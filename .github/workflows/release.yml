name: Release

on:
  push:
    tags: ['v*']

# Scoped to this job only. Nothing here can rewrite the repo's history or
# open pull requests.
permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Required for the linux/arm64 leg. The Dockerfile only copies files, so
      # emulation costs almost nothing here.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # The bare major tag is suppressed while pre-1.0. A sliding `:0` would
          # promise "features and fixes, never breaking changes", which is
          # exactly what 0.x declines to offer — and our own rule breaks it,
          # since a feat! at 0.x bumps the minor. Written as a ref test rather
          # than an omitted line so `:1` starts publishing itself at 1.0.0.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          node tools/release.js --notes "${TAG#v}" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
